# remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

set -g mouse on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind L last-window

# Open new windows/panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key Left swap-window -t -1\; select-window -t -1
bind-key Right swap-window -t +1\; select-window -t +1

# Renumber windows automatically
set-option -g renumber-windows on

# Change keybindings for tmux-resurrect
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Continuum: auto-restore session on server start, save every 15 min
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore-max-delay '60'

# Status bar (must be before TPM so continuum can replace #{continuum_status})
set -g status-right-length 60
set -g status-right '#{continuum_status} | %H:%M %d-%b-%y | #(date -u +"%%H:%%M %%d-%%b-%%y") UTC'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

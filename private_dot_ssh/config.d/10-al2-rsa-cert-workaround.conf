# AL2 dev desktops (openssh 7.4) only advertise the legacy ssh-rsa-cert-v01
# cert type, which modern OpenSSH clients disable by default. Re-enable it
# for those specific hosts so the Midway RSA cert is offered during auth.
Host dev-dsk-drautb-1a-39097e47.us-east-1.amazon.com etdesktop devdesk
  PubkeyAcceptedAlgorithms +ssh-rsa-cert-v01@openssh.com
